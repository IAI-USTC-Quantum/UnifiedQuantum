# Pure-Python build and test workflow. The C++ simulator kernel lives in the
# separate uniqc-cppsimulator repository and is consumed as a PyPI dependency.
name: Build-and-test

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/build_and_test.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/build_and_test.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build (with all optional dependencies)
      run: |
        uv pip uninstall unified-quantum --system -y || true
        uv pip install --system ".[all]"

    - name: Install dev dependencies
      run: |
        uv pip install --system pytest pytest-cov ruff httpx

    - name: Lint first-party Python
      run: ruff check .

    # Keep TorchQuantum integration isolated from the core suite so failures
    # remain attributable even though [all] now installs torchquantum-ng.

    - name: Run non-torchquantum tests with deprecation monitoring
      id: core-tests
      continue-on-error: true
      shell: bash
      env:
        PYTHONWARNINGS: "default::DeprecationWarning,default::FutureWarning"
      run: |
        pytest uniqc/test/ -v --tb=short -m "not cloud" \
          --junitxml=pytest-core.xml \
          --ignore=uniqc/test/adapter/test_tq_algorithms.py \
          --ignore=uniqc/test/simulator/test_torchquantum_simulator.py \
          --ignore=uniqc/test/simulator/test_simulator_factory.py

    - name: Smoke-test the complete PyTorch extra
      if: always()
      run: python scripts/smoke_pytorch_extra.py

    - name: Run torchquantum-touching tests in a separate process
      if: always()
      shell: bash
      env:
        PYTHONWARNINGS: "default::DeprecationWarning,default::FutureWarning"
      run: |
        pytest \
          uniqc/test/adapter/test_tq_algorithms.py \
          uniqc/test/simulator/test_torchquantum_simulator.py \
          uniqc/test/simulator/test_simulator_factory.py \
          -v --tb=short -m "not cloud"

    - name: Fail on first-party warnings
      if: runner.os == 'Linux' && steps.core-tests.outcome == 'success'
      run: |
        pytest uniqc/test/ -q -m "not cloud" -W error::Warning:uniqc \
          --ignore=uniqc/test/adapter/test_tq_algorithms.py \
          --ignore=uniqc/test/simulator/test_torchquantum_simulator.py \
          --ignore=uniqc/test/simulator/test_simulator_factory.py

    - name: Report core test failures
      if: steps.core-tests.outcome == 'failure'
      run: python scripts/report_pytest_failures.py pytest-core.xml
