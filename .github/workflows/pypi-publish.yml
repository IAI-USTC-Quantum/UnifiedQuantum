name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate_release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main:refs/remotes/origin/main

      - name: Validate tag ancestry and changelog
        run: |
          python scripts/check_release.py \
            --tag "${{ github.ref_name }}" \
            --main-ref origin/main \
            --changelog CHANGELOG.md

  build_wheels:
    name: Build pure-Python wheel and sdist
    needs: validate_release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0  # Need full history for setuptools_scm version detection

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Validate wheel release version
        run: python scripts/check_release.py --tag "${{ github.ref_name }}" --wheel "dist/*.whl"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: ./dist/*

  publish:
    name: Publish to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist/
          merge-multiple: true

      - name: Validate publish artifacts
        run: python scripts/check_release.py --tag "${{ github.ref_name }}" --wheel "dist/*.whl"

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
